name: Melaka Flood Scraper & Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 15 minutes
  workflow_dispatch:       # Enables a manual "Run workflow" button in GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download code from repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install necessary libraries
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # Step 4: Run the scraper script
      - name: Scrape Water Levels & Trigger Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scrapper.py

      # Step 5: Commit and push updated data.json back to GitHub
      - name: Commit Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update river & tide levels [skip ci]" || exit 0
          git push
